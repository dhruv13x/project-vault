[project]
name = "project-vault-core"
version = "1.0.1"
description = "Core library for Project Vault ecosystem"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "boto3",
    "b2sdk",
    "rich",
    "zstandard>=0.22.0",
    "tomli; python_version < '3.11'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-mock>=3.10.0",
  "pyfakefs>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pv_core"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
  "-v",
  "--cov=pv_core",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]