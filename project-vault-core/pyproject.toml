[project]
name = "project-vault-core"
version = "1.0.0"
description = "Core library for Project Vault ecosystem"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "boto3",
    "b2sdk",
    "rich",
    "zstandard>=0.22.0",
    "tomli; python_version < '3.11'"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pv_core"]
