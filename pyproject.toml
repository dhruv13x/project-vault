[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vault"
version = "0.1.0"
description = "The Unified Project Lifecycle Manager"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich",
    "tqdm",
    "boto3",
    "tomli",
]

[project.scripts]
pv = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.project-vault]
bucket = "project-vault-backups"
endpoint = "https://s3.eu-central-003.backblazeb2.com"

[tool.pytest.ini_options]
addopts = [
    "--timeout=10",
    "--durations=10",
    "--log-cli-level=INFO",
    "-v",
    "-ra",
    "--tb=short",
    "--showlocals",
    "--strict-markers",
    "--cov=src",
    "--cov=projectclone",
    "--cov=projectrestore",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=97",
]

log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = [
    "src",
    "projectclone",
    "projectrestore",
]

[tool.coverage.report]
show_missing = true
