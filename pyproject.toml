[project]
name = "project-vault"
version = "1.0.0"
description = "The Unified Project Lifecycle Manager: Backup, Restore, and Teleport Projects Anywhere."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dhruv", email = "your.email@example.com"}
]
dependencies = [
    "projectclone",
    "projectrestore",
    "boto3",
    "b2sdk",
    "rich",
    "tomli; python_version < '3.11'"
]

[project.scripts]
pv = "src.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.common"]




[project.optional-dependencies]
dev = [
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d",
  "d"
]

[tool.pytest.ini_options]
# All projects use src/ layout
pythonpath = ["src"]

# All tests live under tests/
testpaths = ["tests"]

# Async projects are common in your stack
asyncio_mode = "auto"

# Global pytest options
addopts = [
  "-v",
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "--showlocals",
  "--import-mode=importlib",

  # Time & perf
  "--timeout=10",
  "--durations=10",

  # Coverage: target the real package
  "--cov=src/project_vault",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=85",
]

log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
branch = true
source = ["src/project_vault"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
