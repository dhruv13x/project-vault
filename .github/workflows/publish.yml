name: 🚀 Publish Monorepo to PyPI

on:
  push:
    tags:
      - "v*.*.*"  # Trigger only on semantic version tags (e.g., v1.0.0)

permissions:
  contents: read
  id-token: write  # Required for PyPI OIDC Trusted Publishing

jobs:
  test-and-publish:
    name: Build & Publish All Packages
    runs-on: ubuntu-latest
    environment: pypi 

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-cov

      # --- Testing Phase ---
      # We install dependencies manually since we are in a monorepo pre-publish state
      - name: 🧪 Run Tests
        run: |
          # Install local deps in editable mode for testing
          pip install -e ./projectclone
          pip install -e ./projectrestore
          pip install -e .
          
          # Run the full test suite
          pytest

      # --- Build Phase ---
      # We build all 3 packages into the same 'dist/' directory
      
      - name: ⚙️ Build projectclone
        run: python -m build projectclone/ --outdir dist/

      - name: ⚙️ Build projectrestore
        run: python -m build projectrestore/ --outdir dist/

      - name: ⚙️ Build project-vault (Root)
        run: python -m build . --outdir dist/

      - name: ✅ Check Artifacts
        run: |
          ls -l dist/
          twine check dist/*

      # --- Publish Phase ---
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages_dir: dist/
          verbose: true
          skip_existing: true # Allow partial updates if one package failed previously